[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hass-airtrail"
dynamic = ["version"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
dependencies = [
    "ruff",
]

[tool.hatch.envs.default.scripts]
test = [
    "ruff check .",
    "ruff format --check --diff .",
]
lint = [
    "ruff check --fix .",
    "ruff format .",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "E501", # line length is left to the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
