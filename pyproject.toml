[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hass-airtrail"
dynamic = ["version"]
requires-python = ">=3.14.2"

[project.optional-dependencies]
lint = [
    "ruff==0.17.1",
]
test = [
    "pytest-homeassistant-custom-component==0.13.373",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/airtrail"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
# Through an extra rather than env dependencies, so Dependabot can see the pin.
features = ["lint"]

[tool.hatch.envs.default.scripts]
lint = [
    "ruff format --check --diff .",
    "ruff check .",
]
fix = [
    "ruff format .",
    "ruff check --fix .",
]

[tool.hatch.envs.test]
python = "3.14"
features = ["test"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "E501", # line length is left to the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
